name: Apply attachments v2

on:
  push:
    branches:
      - refactor/exame-fisico-semiologia

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/exame-fisico-semiologia
          fetch-depth: 0
      - name: Integrar leitor de anexos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="/attachments-v2.js?v=1"></script>'
          if marker not in s:
              anchor='<script src="/clinical-pipeline-v2.js?v=1"></script>'
              if anchor in s: s=s.replace(anchor, anchor+'\n'+marker,1)
              else:
                  i=s.lower().rfind('</body>')
                  if i<0: raise SystemExit('index sem body')
                  s=s[:i]+marker+'\n'+s[i:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'fix: integra leitor ampliado de prontuarios PDF'
          git push origin HEAD:refactor/exame-fisico-semiologia
