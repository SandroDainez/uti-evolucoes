name: Patch Semiologia v2 quality

on:
  push:
    branches:
      - refactor/exame-fisico-semiologia

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/exame-fisico-semiologia
          fetch-depth: 0
      - name: Aplicar correcoes pontuais
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('public/semiologia-v2.js')
          s=p.read_text(encoding='utf-8')

          old="function syncFrom(id){ const e=$(id); if(!e) return; const w=e.closest('.sv2-field'); if(w) sync(w.dataset.sv2Key); else syncAdditional(); }"
          new="function syncFrom(id){ const e=$(id); if(!e) return; const w=e.closest('.sv2-field'); if(!w) return; if(w.dataset.sv2Key) sync(w.dataset.sv2Key); else if(w.dataset.extraKey) syncAdditional(); }"
          if old not in s: raise SystemExit('ancora syncFrom nao encontrada')
          s=s.replace(old,new,1)

          old="""    const em={alerta:'alerta e vígil',sonolento:'sonolento',letargico:'letárgico',obnubilado:'obnubilado',confuso:'confuso',agitado:'agitado',torporoso:'torporoso',comatoso:'comatoso/não responsivo'};
    const rm={espontanea:'com resposta espontânea',verbal:'desperta/responde ao chamado verbal',toque:'responde ao toque',dor:'responde apenas a estímulo doloroso',sem:'sem resposta a estímulos'};
    const om={pte:'orientado em pessoa, tempo e espaço',tempo:'desorientado no tempo',espaco:'desorientado no espaço',pessoa:'desorientado quanto à pessoa',global:'com desorientação global'};
    const extras=[['coop','cooperativo'],['pcoop','pouco cooperativo'],['inat','com inatenção'],['lento','com respostas lentificadas'],['incoer','com discurso incoerente'],['flut','com flutuação do nível de consciência']].filter(([k])=>checked('sv2_ncons_'+k)).map(x=>x[1]);
    return [em[val('sv2_ncons_estado')],rm[val('sv2_ncons_resp')],om[val('sv2_ncons_ori')],extras.join(', ')].filter(Boolean).join(', ');"""
          new="""    const em={alerta:'alerta e vígil',sonolento:'sonolento',letargico:'letárgico',obnubilado:'obnubilado',confuso:'confuso',agitado:'agitado',torporoso:'torporoso',comatoso:'comatoso/não responsivo'};
    const rm={espontanea:'com resposta espontânea',verbal:'desperta/responde ao chamado verbal',toque:'responde ao toque',dor:'responde apenas a estímulo doloroso',sem:'sem resposta a estímulos'};
    const om={pte:'orientado em pessoa, tempo e espaço',tempo:'desorientado no tempo',espaco:'desorientado no espaço',pessoa:'desorientado quanto à pessoa',global:'com desorientação global'};
    const st=val('sv2_ncons_estado');
    const response = st==='comatoso' ? 'sem resposta a estímulos' : rm[val('sv2_ncons_resp')];
    const orientation = (st==='comatoso' || st==='torporoso') ? '' : om[val('sv2_ncons_ori')];
    const extras=[['coop','cooperativo'],['pcoop','pouco cooperativo'],['inat','com inatenção'],['lento','com respostas lentificadas'],['incoer','com discurso incoerente'],['flut','com flutuação do nível de consciência']].filter(([k])=>checked('sv2_ncons_'+k)).map(x=>x[1]);
    return [em[st],response,orientation,extras.join(', ')].filter(Boolean).join(', ');"""
          if old not in s: raise SystemExit('ancora consciencia nao encontrada')
          s=s.replace(old,new,1)

          old="""    const pm={normal:'normal',dim:'diminuído',fil:'filiforme',aus:'ausente',dop:'detectável apenas ao Doppler'}; const pulses=[]; document.querySelectorAll('#sv2_perf_rows .sv2-list-row').forEach(r=>{ const i=r.dataset.row,t=val(`sv2_perf_pterr_${i}`),q=val(`sv2_perf_pqual_${i}`); if(t&&q) pulses.push(`pulso ${String(PULSE_LABEL[t]).toLowerCase()} ${pm[q]}`); }); if(pulses.length) parts.push(pulses.join(', '));"""
          new="""    const pm={normal:'normal',dim:'diminuído',fil:'filiforme',aus:'ausente',dop:'detectável apenas ao Doppler'}; const pulseMap=new Map(); document.querySelectorAll('#sv2_perf_rows .sv2-list-row').forEach(r=>{ const i=r.dataset.row,t=val(`sv2_perf_pterr_${i}`),q=val(`sv2_perf_pqual_${i}`); if(t&&q) pulseMap.set(t,`pulso ${String(PULSE_LABEL[t]).toLowerCase()} ${pm[q]}`); }); const pulses=[...pulseMap.values()]; if(pulses.length) parts.push(pulses.join(', '));"""
          if old not in s: raise SystemExit('ancora pulsos nao encontrada')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/semiologia-v2.js
          git commit -m 'fix: melhora coerencia e sincronizacao da semiologia v2'
          git push origin HEAD:refactor/exame-fisico-semiologia
