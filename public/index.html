<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UTI Evoluções</title></head>
<body style="margin:0;background:#0a0e14;color:#e0eaf5;font-family:system-ui,sans-serif">
<div id="boot" style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:14px">Carregando UTI Evoluções…</div>
<script>
(async function(){
  try {
    const r = await fetch('/index-legacy.html', {cache:'no-store'});
    if (!r.ok) throw new Error('Falha ao carregar aplicação base: HTTP '+r.status);
    let html = await r.text();
    const tag = '<script src="/semiologia-v2.js?v=2"><\\/script>';
    if (/<\\/body>/i.test(html)) html = html.replace(/<\\/body>/i, tag + '</body>');
    else html += tag;
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    const el=document.getElementById('boot');
    if(el) el.innerHTML='<div style="max-width:640px;padding:24px"><b>Não foi possível iniciar o aplicativo.</b><br><br>'+String(e && e.message || e)+'</div>';
    console.error('[boot]',e);
  }
})();
</script>
</body>
</html>
